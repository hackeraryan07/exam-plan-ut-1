/* Layout: one scrolling column capped at 1120px. Bottom tab bar on phones, left rail from 840px up.

:root {
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;

  --bg: oklch(0.975 0.006 255);
  --surface: oklch(0.995 0.003 255);
  --surface-2: oklch(0.953 0.009 255);
  --fg: oklch(0.25 0.025 255);
  --muted: oklch(0.47 0.02 255);
  --line: oklch(0.89 0.01 255);
  --accent: oklch(0.5 0.17 255);
  --accent-fg: oklch(0.99 0.003 255);
  --accent-soft: oklch(0.94 0.035 255);
  --ok: oklch(0.5 0.13 155);
  --ok-soft: oklch(0.94 0.04 155);
  --warn: oklch(0.5 0.17 35);
  --warn-soft: oklch(0.95 0.035 50);
  --focus: oklch(0.55 0.2 255);
  --shadow: 0 1px 2px oklch(0.3 0.03 255 / 0.08);
  --tag-bg-l: 0.94; --tag-bg-c: 0.04; --tag-fg-l: 0.38; --tag-fg-c: 0.12;
  --nav-bg: oklch(0.995 0.003 255 / 0.96);

  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px;
  --step--1: clamp(0.82rem, 0.8rem + 0.1vw, 0.9rem);
  --step-0: 1rem;
  --step-1: clamp(1.15rem, 1.08rem + 0.35vw, 1.4rem);
  --step-2: clamp(1.45rem, 1.3rem + 0.8vw, 2rem);
  --step-3: clamp(1.8rem, 1.5rem + 1.4vw, 2.7rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.17 0.012 255);
    --surface: oklch(0.215 0.014 255);
    --surface-2: oklch(0.26 0.016 255);
    --fg: oklch(0.94 0.008 255);
    --muted: oklch(0.72 0.014 255);
    --line: oklch(0.33 0.015 255);
    --accent: oklch(0.74 0.14 255);
    --accent-fg: oklch(0.17 0.02 255);

    --ok: oklch(0.76 0.13 155);
    --ok-soft: oklch(0.28 0.05 155);
    --warn: oklch(0.78 0.13 45);
    --warn-soft: oklch(0.29 0.05 45);
    --focus: oklch(0.8 0.13 255);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.4);
    --tag-bg-l: 0.3; --tag-bg-c: 0.06; --tag-fg-l: 0.86; --tag-fg-c: 0.1;
    --nav-bg: oklch(0.215 0.014 255 / 0.96);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.012 255);
  --surface: oklch(0.215 0.014 255);
  --surface-2: oklch(0.26 0.016 255);
  --fg: oklch(0.94 0.008 255);
  --muted: oklch(0.72 0.014 255);
  --line: oklch(0.33 0.015 255);
  --accent: oklch(0.74 0.14 255);
  --accent-fg: oklch(0.17 0.02 255);
  --accent-soft: oklch(0.29 0.05 255);
  --ok: oklch(0.76 0.13 155);
  --ok-soft: oklch(0.28 0.05 155);
  --warn: oklch(0.78 0.13 45);
  --warn-soft: oklch(0.29 0.05 45);
  --focus: oklch(0.8 0.13 255);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4);
  --tag-bg-l: 0.3; --tag-bg-c: 0.06; --tag-fg-l: 0.86; --tag-fg-c: 0.1;
  --nav-bg: oklch(0.215 0.014 255 / 0.96);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--step-0)/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 104px;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: var(--step-2); font-weight: 700; }
h2 { font-size: var(--step-1); font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
.brand { display: flex; flex-direction: column; gap: 4px; padding-block: var(--s1); }
.brand b { font-family: var(--font-head); font-size: 1.1rem; }
.brand span { color: var(--muted); font-size: var(--step--1); }
main { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--nav-bg); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  backdrop-filter: blur(8px);
}
.nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 56px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 0.78rem; font-weight: 500;
  transition: background-color 140ms ease, color 140ms ease;
}
.nav a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

@media (min-width: 840px) {
  body { padding-block: 32px 48px; }
  .app { grid-template-columns: 208px minmax(0, 1fr); gap: var(--s4); align-items: start; }
  .rail { position: sticky; top: 32px; display: flex; flex-direction: column; gap: var(--s3); }
  .nav { position: static; display: flex; flex-direction: column; gap: 4px; background: none; border: 0; padding: 0; backdrop-filter: none; }
  .nav a { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; min-height: 44px; font-size: 0.95rem; }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: var(--s2); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
@media (min-width: 600px) { .card { padding: var(--s3); } }
.grid { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.row { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

.tag { --h: 255; display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
  background: oklch(var(--tag-bg-l) var(--tag-bg-c) var(--h)); color: oklch(var(--tag-fg-l) var(--tag-fg-c) var(--h)); white-space: nowrap; }
.tag.exam { background: var(--warn-soft); color: var(--warn); }
.tag.rest { background: var(--ok-soft); color: var(--ok); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 260ms cubic-bezier(.3,1.3,.5,1); }
.bar.ok > span { background: var(--ok); }

.hero { display: flex; flex-direction: column; gap: var(--s2); }
.cd { display: flex; gap: var(--s2); flex-wrap: wrap; }
.cd div { display: flex; flex-direction: column; min-width: 64px; }
.cd b { font-family: var(--font-head); font-size: var(--step-3); line-height: 1; font-variant-numeric: tabular-nums; }
.cd span { font-size: var(--step--1); color: var(--muted); }

.block { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.block:first-child { border-top: 0; }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; margin: -8px 0 -8px -8px; transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease; }
.chk svg { width: 22px; height: 22px; stroke: var(--accent-fg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.chk:active { transform: scale(0.94); }
.block .body { display: flex; flex-direction: column; gap: 4px; }
.block.done .body p { color: var(--muted); text-decoration: line-through; }
.kind { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.kind.study { color: var(--accent); } .kind.revise { color: var(--ok); } .kind.exam { color: var(--warn); } .kind.rest { color: var(--muted); }

.chips { display: flex; gap: var(--s1); overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; transition: background-color 120ms ease; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.topic { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.topic:first-of-type { border-top: 0; }
.topic h4 { font-size: 1rem; font-weight: 600; font-family: var(--font-body); }
.topic .head { display: flex; gap: var(--s1); align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.mk { font-size: 0.76rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.tog-row { display: flex; gap: var(--s1); }
.tog { min-height: 44px; min-width: 96px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.92rem; transition: background-color 120ms ease, color 120ms ease, transform 120ms ease; }
.tog:hover { background: var(--surface-2); }
.tog:active { transform: scale(0.97); }
.tog.learn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tog.revise[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }

.files { display: flex; flex-direction: column; gap: 6px; }
.files li { overflow-wrap: anywhere; }

.day { gap: 12px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.day.past { opacity: 0.62; }
.day .block { padding: 10px 0; }
.day .block .body p { font-size: 0.95rem; }

details { border-top: 1px solid var(--line); }
details:first-of-type { border-top: 0; }
summary { list-style: none; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: var(--s1); cursor: pointer; font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 1.4rem; color: var(--muted); }
details[open] summary::after { content: "\2212"; }
.eqs { display: flex; flex-direction: column; gap: 2px; padding-bottom: var(--s2); }
.eqr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 10px 12px; border-radius: 10px; }
.eqr:nth-child(odd) { background: var(--surface-2); }
.eql { font-size: var(--step--1); color: var(--muted); }
.eq { font-size: 1rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
@media (min-width: 640px) { .eqr { grid-template-columns: 220px minmax(0, 1fr); gap: var(--s2); } }

.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.steps { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.step { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.step b { font-family: var(--font-head); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      return '<button class="chip" data-act="subj" data-s="' + x.id + '" data-fk="c' + x.id + '" aria-pressed="' + (x.id === s.id) + '">' + esc(x.short) + '</button>';
    }).join('');
    var units = s.units.map(function (u) {
      var rows = u.topics.map(function (tp) {
        var l = !!state.learn[tp.id], r = !!state.revise[tp.id];
        return '<div class="topic"><div class="head"><h4>' + esc(tp.t) + '</h4><span class="mk">' + esc(tp.m) + '</span></div>' +
          '<p class="muted small">' + esc(tp.n) + '</p>' +
          '<div class="tog-row"><button class="tog learn" data-act="tog" data-k="learn" data-id="' + tp.id + '" data-fk="l' + tp.id + '" aria-pressed="' + l + '">Learned</button>' +
          '<button class="tog revise" data-act="tog" data-k="revise" data-id="' + tp.id + '" data-fk="r' + tp.id + '" aria-pressed="' + r + '">Revised</button></div></div>';
      }).join('');
      return '<section class="card"><h3>' + esc(u.name) + '</h3><div>' + rows + '</div></section>';
    }).join('');
    var files = s.files.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    return '<h1>Subjects</h1><div class="chips" role="group" aria-label="Choose subject">' + chips + '</div>' +
      '<section class="card"><div class="row between"><h2>' + esc(s.name) + '</h2><span class="tag exam">' + esc(s.when) + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuenow="' + p.pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Subject progress"><span style="width:' + p.pct + '%"></span></div>' +
      '<p class="muted small">' + p.learn + ' of ' + p.total + ' topics learned, ' + p.revise + ' revised. Mark Learned after you can explain it, Revised after you can write it from memory.</p>' +
      '<div><h3 style="margin-bottom:8px;font-size:0.95rem">Drive files to use</h3><ul class="files">' + files + '</ul></div></section>' + units;
  }

  function viewPlan() {
    var t = todayIST();
    var rhythm = '<section class="card"><h2>How revision works</h2><div class="steps">' +
      '<div class="step"><b>Same night</b><span class="muted small">10 to 20 minutes. Close the notes and write the definitions, diagram or formula from memory.</span></div>' +
      '<div class="step"><b>Next day</b><span class="muted small">Redo one numerical or derivation from yesterday before starting new work.</span></div>' +
      '<div class="step"><b>Two days later</b><span class="muted small">Rewrite one 6M answer in full. Mark Revised only if you finished without looking.</span></div>' +
      '<div class="step"><b>Night before the exam</b><span class="muted small">Formula page and diagrams only. Learn nothing new and sleep 6 to 7 hours.</span></div></div></section>';
    var method = '<section class="card"><h2>How to write each answer in 1 hour</h2><div class="steps">' +
      '<div class="step"><b>6M, about 10 min</b><span class="muted small">One line definition, a labelled diagram, 4 to 5 steps or points, final result or formula.</span></div>' +
      '<div class="step"><b>3-4M, about 5 min</b><span class="muted small">Definition or formula, one diagram or example, 3 points.</span></div>' +
      '<div class="step"><b>1M, about 1 min</b><span class="muted small">One line. Move on.</span></div>' +
      '<div class="step"><b>Numerical</b><span class="muted small">Given data, formula, substitution, answer with unit. Units lose marks.</span></div>' +
      '<div class="step"><b>If you blank out</b><span class="muted small">Write the given data, draw the diagram, write the starting law and its first line. Partial marks come from these.</span></div>' +
      '<div class="step"><b>Last 5 minutes</b><span class="muted small">Attempt every question you skipped. A blank earns nothing.</span></div></div></section>';
    var days = SCHEDULE.map(function (d) { return dayCard(d, t, false); }).join('');
    return '<h1>Plan</h1>' + rhythm + method + '<div><h2 style="margin-bottom:12px">Day by day, 13 Nov to 4 Dec</h2><div class="grid">' + days + '</div></div>';
  }

  function viewCheat() {
    var items = FORMULAS.map(function (f, i) {
      var rows = f.rows.map(function (r) { return '<div class="eqr"><span class="eql">' + r[0] + '</span><span class="eq">' + r[1] + '</span></div>'; }).join('');
      return '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(f.s) + '</summary><div class="eqs">' + rows + '</div></details>';
    }).join('');
    var reset = '<section class="card"><h3>Progress</h3><p class="muted small">Your ticks are saved in this browser only. Resetting clears all of them.</p>' +
      '<div class="row"><button class="btn danger" data-act="reset" data-fk="reset">' + (armed ? 'Tap again to erase all progress' : 'Reset progress') + '</button>' +
      (armed ? '<button class="btn" data-act="cancel" data-fk="cancel">Keep my progress</button>' : '') + '</div></section>';
    return '<h1>Formulas</h1><p class="muted">Copy each subject onto one A4 page and read it the night before.</p><section class="card" style="gap:0">' + items + '</section>' + reset;
  }

  function startCountdown() {
    if (timer) { clearInterval(timer); timer = null; }
    var el = document.getElementById('cd');
    var ne = nextExam();
    if (!el || !ne) return;
    function tick() {
      var ms = examTime(ne) - Date.now();
      if (ms < 0) { ms = 0; }
      var d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
      el.innerHTML = '<div><b>' + d + '</b><span>days</span></div><div><b>' + h + '</b><span>hours</span></div><div><b>' + m + '</b><span>minutes</span></div>';
    }
    tick();
    timer = setInterval(tick, 30000);
  }

  function render(focusKey) {
    var main = document.getElementById('main');
    var html = current === 'subjects' ? viewSubjects() : current === 'plan' ? viewPlan() : current === 'cheat-sheet' ? viewCheat() : viewToday();
    main.innerHTML = html;
    var links = document.querySelectorAll('.nav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-tab') === current) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
    if (current === 'today') startCountdown();
    else if (timer) { clearInterval(timer); timer = null; }
    if (focusKey) {
      var f = main.querySelector('[data-fk="' + focusKey + '"]');
      if (f) f.focus({ preventScroll: true });
    }
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (TABS.indexOf(h) < 0) h = 'today';
    current = h;
    armed = false;
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var fk = el.getAttribute('data-fk');
    if (act === 'done') {
      var k = el.getAttribute('data-key');
      if (state.done[k]) delete state.done[k]; else state.done[k] = true;
      save(); render(fk);
    } else if (act === 'tog') {
      var kind = el.getAttribute('data-k'), id = el.getAttribute('data-id');
      if (state[kind][id]) delete state[kind][id]; else state[kind][id] = true;
      save(); render(fk);
    } else if (act === 'subj') {
      state.subject = el.getAttribute('data-s');
      save(); render(fk);
    } else if (act === 'open') {
      state.subject = el.getAttribute('data-s');
      save();
      if (location.hash === '#subjects') route(); else location.hash = 'subjects';
    } else if (act === 'reset') {
      if (!armed) { armed = true; render('reset'); }
      else { state.learn = {}; state.revise = {}; state.done = {}; armed = false; save(); render('reset'); }
    } else if (act === 'cancel') {
      armed = false; render('reset');
    }
  });

  window.addEventListener('hashchange', route);
  load();
  route();
})();
</script>

</body></html>
